[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-sonic"
version = "0.1.0"
description = "Isolated motion-matching bridge for the pinned GEAR-SONIC deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
integration = [
  "mujoco",
  "pyzmq",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
