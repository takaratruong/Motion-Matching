[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-sonic"
version = "0.1.0"
description = "Isolated motion-matching bridge for the pinned GEAR-SONIC deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
test = [
  "jsonschema==4.25.1",
]
integration = [
  "mujoco",
  "pyzmq",
  "scipy==1.15.3",
  "PyYAML==6.0.3",
  "cyclonedds==0.10.2",
]
torch-mm = [
  "torch>=2.13",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
